# Publica la demo en la RAÍZ de la rama gh-pages (sin borrar las carpetas vX.Y.Z/ de las releases).
# GitHub Pages sirve la rama gh-pages: así funcionan a la vez la demo y https://juampee.github.io/ucjc-identidad-plus/vX.Y.Z/remote.js
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npx vite build --config vite.demo.config.js
      - name: Copiar la demo a gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/pages origin/gh-pages
          cd /tmp/pages && git checkout -B gh-pages && cd -
          rm -rf /tmp/pages/assets /tmp/pages/index.html
          cp -r dist-demo/. /tmp/pages/
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Demo en gh-pages" || exit 0
          git push origin gh-pages
