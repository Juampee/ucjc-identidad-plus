name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Publicar en gh-pages/<tag>/
        run: |
          TAG="${GITHUB_REF_NAME}"
          git fetch origin gh-pages || true
          git worktree add /tmp/pages gh-pages 2>/dev/null || git worktree add --orphan -b gh-pages /tmp/pages
          mkdir -p "/tmp/pages/${TAG}"
          cp dist/remote.js "/tmp/pages/${TAG}/remote.js"
          touch /tmp/pages/.nojekyll
          cd /tmp/pages
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          git commit -m "Release ${TAG}" || true
          git push origin HEAD:gh-pages
