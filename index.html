<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Identidad · Tienda UCJC</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #e9edf8; padding: 24px 12px; font-family: system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #0b0f19; } }
    pre { max-width: 460px; margin: 16px auto; padding: 12px; border-radius: 12px; background: #11172a; color: #b9c6ff; font-size: 12px; overflow: auto; }
  </style>
</head>
<body>
  <ucjc-identidad inicio-rapido></ucjc-identidad>
  <pre id="log">Eventos ucjc:identidad:sesion-cambiada@1…</pre>
  <script type="module">
    import './src/main.js';
    window.addEventListener('ucjc:identidad:sesion-cambiada@1', (e) => {
      document.getElementById('log').textContent = 'ucjc:identidad:sesion-cambiada@1\n' + JSON.stringify(e.detail, null, 2);
    });
  </script>
</body>
</html>
